# @package _global_
# Social Nav first-person depth video (1080p)
#
# Mechanism: render sensors are placed in two locations simultaneously:
# 1. Each agent's sim_sensors -> ensures correct mounting (no cross-agent)
# 2. extra_sim_sensors -> auto-excluded by policy's from_config, no model impact

defaults:
  - /benchmark/multi_agent: hssd_spot_human_social_nav
  - /habitat_baselines: habitat_baselines_rl_config_base
  # ---- render sensors in each agent's sim_sensors (for mounting) ----
  - /habitat/simulator/sim_sensors@habitat.simulator.agents.agent_0.sim_sensors.render_arm_depth_sensor: render_arm_depth_sensor
  - /habitat/simulator/sim_sensors@habitat.simulator.agents.agent_1.sim_sensors.render_head_depth_sensor: render_head_depth_sensor
  # ---- also in extra_sim_sensors (for policy exclusion) ----
  - /habitat/simulator/sim_sensors@habitat_baselines.eval.extra_sim_sensors.render_arm_depth_sensor: render_arm_depth_sensor
  - /habitat/simulator/sim_sensors@habitat_baselines.eval.extra_sim_sensors.render_head_depth_sensor: render_head_depth_sensor
  # ---- Policy & skills ----
  - /habitat_baselines/rl/policy/obs_transforms@habitat_baselines.rl.policy.agent_0.obs_transforms.add_virtual_keys:
    - add_virtual_keys_base
  - /habitat_baselines/rl/policy/obs_transforms@habitat_baselines.rl.policy.agent_1.obs_transforms.add_virtual_keys:
    - add_virtual_keys_base
  - /habitat_baselines/rl/policy@habitat_baselines.rl.policy.agent_0: monolithic
  - /habitat_baselines/rl/policy@habitat_baselines.rl.policy.agent_1: hl_fixed
  - /habitat_baselines/rl/policy/hierarchical_policy/defined_skills@habitat_baselines.rl.policy.agent_1.hierarchical_policy.defined_skills: oracle_skills_human_multi_agent
  - _self_

hydra:
  job:
    name: 'social_nav'

habitat_baselines:
  verbose: False
  trainer_name: "ddppo"
  updater_name: "HRLPPO"
  distrib_updater_name: "HRLDDPPO"
  torch_gpu_id: 0
  video_fps: 30
  eval_ckpt_path_dir: "data/checkpoints"
  num_environments: 18
  num_updates: -1
  total_num_steps: 5.0e7
  log_interval: 10
  num_checkpoints: 100
  force_torch_single_threaded: True
  eval_keys_to_include_in_name: ['pddl_success']
  load_resume_state_config: False
  rollout_storage_name: "HrlRolloutStorage"

  evaluate: False

  eval:
    extra_sim_sensors:
      render_arm_depth_sensor:
        height: 1080
        width: 1920
      render_head_depth_sensor:
        height: 1080
        width: 1920

    should_load_ckpt: True
    video_option: ["disk"]

  rl:
    agent:
      type: "MultiAgentAccessMgr"
      num_agent_types: 2
      num_active_agents_per_type: [1, 1]
      num_pool_agents_per_type: [1, 1]
      agent_sample_interval: 20
      force_partner_sample_idx: -1
    policy:
      agent_0:
        name: "PointNavResNetPolicy"
        action_distribution_type: "gaussian"
        action_dist:
          use_log_std: True
          clamp_std: True
          std_init: -1.0
          use_std_param: True
      agent_1:
        hierarchical_policy:
          high_level_policy:
            add_arm_rest: False
            policy_input_keys:
              - "head_depth"
              - "is_holding"
              - "obj_start_gps_compass"
              - "obj_goal_gps_compass"
              - "other_agent_gps"
              - "obj_start_sensor"
              - "obj_goal_sensor"
            allowed_actions:
              - nav_to_goal
              - nav_to_obj
              - pick
              - place
              - nav_to_receptacle_by_name
          defined_skills:
            nav_to_randcoord:
              skill_name: "OracleNavCoordPolicy"
              obs_skill_inputs: ["obj_start_sensor", "abs_obj_start_sensor", "obj_goal_sensor", "abs_obj_goal_sensor"]
              max_skill_steps: 1500
              ignore_grip: True
    ppo:
      clip_param: 0.2
      ppo_epoch: 1
      num_mini_batch: 2
      value_loss_coef: 0.5
      entropy_coef: 0.0001
      lr: 2.5e-4
      eps: 1e-5
      max_grad_norm: 0.2
      num_steps: 128
      use_gae: True
      gamma: 0.99
      tau: 0.95

    ddppo:
      sync_frac: 0.6
      distrib_backend: NCCL
      pretrained_weights: data/ddppo-models/gibson-2plus-resnet50.pth
      pretrained: False
      pretrained_encoder: False
      train_encoder: True
      reset_critic: False
      backbone: resnet18
      rnn_type: LSTM
      num_recurrent_layers: 2

# Render sensor resolution overrides (directly overrides agent sim_sensors values)
habitat:
  simulator:
    agents:
      agent_0:
        sim_sensors:
          render_arm_depth_sensor:
            height: 1080
            width: 1920
      agent_1:
        sim_sensors:
          render_head_depth_sensor:
            height: 1080
            width: 1920
  gym:
    obs_keys:
      - agent_0_articulated_agent_arm_depth
      - agent_0_spot_head_stereo_depth_sensor
      - agent_0_humanoid_detector_sensor
      - agent_0_articulated_agent_arm_depth_render
      - agent_1_head_depth
      - agent_1_relative_resting_position
      - agent_1_obj_start_sensor
      - agent_1_obj_goal_sensor
      - agent_1_obj_start_gps_compass
      - agent_1_obj_goal_gps_compass
      - agent_1_is_holding
      - agent_1_ee_pos
      - agent_1_localization_sensor
      - agent_1_has_finished_oracle_nav
      - agent_1_other_agent_gps
      - agent_1_head_depth_render
